name: Build PalmPass APK

# Put this file at:  .github/workflows/build-apk.yml
# Repo layout:       index.html  +  assets/ folder (the 5 PNG icon files)
# Builds Android APK and deploys the iOS-installable PWA when app files change (data/*.json pushes do NOT trigger it),
# or manually from the Actions tab (Run workflow).
on:
  push:
    branches: [main, master]
    paths:
      - "index.html"
      - "assets/**"
      - "manifest.webmanifest"
      - "sw.js"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write   # publish the Android APK release
  pages: write      # publish the iOS-installable PWA
  id-token: write   # authenticate GitHub Pages deployment

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      BRAND_COLOR: "#160e3d"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Guarantees the Android platform/build-tools exist and licences are accepted
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      # ---------------------------------------------------------------
      # 1. Bundle MediaPipe hand recognition for offline palm capture.
      #    FaceAPI and all face-recognition models are intentionally excluded.
      #    vision_bundle.mjs is renamed to .js for Android WebView compatibility.
      # ---------------------------------------------------------------
      - name: Bundle MediaPipe hand model for offline use
        run: |
          set -euo pipefail
          test -f index.html || { echo "::error::index.html not found in the repo root"; exit 1; }

          mkdir -p www/vendor/wasm
          npm init -y >/dev/null
          npm install --no-audit --no-fund @mediapipe/tasks-vision@0.10.14 esbuild

          npx esbuild node_modules/@mediapipe/tasks-vision/vision_bundle.mjs \
            --bundle --format=esm --platform=browser --target=es2020 \
            --outfile=www/vendor/vision_bundle.js
          cp node_modules/@mediapipe/tasks-vision/wasm/* www/vendor/wasm/

          curl -fL --retry 4 --retry-delay 3 -o www/vendor/hand_landmarker.task \
            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"

          test "$(stat -c%s www/vendor/hand_landmarker.task)" -gt 1000000 || { echo "::error::hand model download is incomplete"; exit 1; }
          test -s www/vendor/wasm/vision_wasm_internal.wasm || { echo "::error::MediaPipe wasm files missing"; exit 1; }
          test -s www/vendor/vision_bundle.js || { echo "::error::MediaPipe JavaScript bundle is missing"; exit 1; }

          cp index.html www/index.html
          mkdir -p www/assets
          cp assets/*.png www/assets/
          # The native Android WebView does not rely on the PWA service worker.
          # Keep a small manifest and harmless worker so shared HTML paths resolve.
          cat > www/manifest.webmanifest <<'JSON'
          {"name":"PalmPass","short_name":"PalmPass","start_url":"./","display":"standalone","background_color":"#05060e","theme_color":"#05060e"}
          JSON
          printf 'self.addEventListener("fetch", () => {});\n' > www/sw.js

          # Rewrite only the MediaPipe hand-model/runtime paths to local files.
          sed -i 's|https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs|./vendor/vision_bundle.js|g' www/index.html
          sed -i 's|https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm|./vendor/wasm|g' www/index.html
          sed -i 's|https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task|./vendor/hand_landmarker.task|g' www/index.html

          # Prevent accidentally shipping face-recognition assets or references.
          if grep -Eiq 'face-api|face_landmarker|face_recognition_model|tiny_face_detector' www/index.html; then
            echo "::error::Face-recognition code/reference detected in index.html. Remove it before building."
            exit 1
          fi

          ls -lh www/vendor www/vendor/wasm

      # ---------------------------------------------------------------
      # 2. Install dependencies and wrap the web app in an Android project (Capacitor 6).
      #    GitHub API calls (api.github.com) still work online from inside the app.
      # ---------------------------------------------------------------
      - name: Install dependencies
        run: |
          set -e
          npm install
          npm install @capacitor-community/text-to-speech@4.0.2
          npm install --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/app@6 @capacitor/assets@3 esbuild

      - name: Create Android project
        run: |
          set -e
          mkdir -p www/vendor
          cat > tts-bridge-entry.js <<'JS'
          import { TextToSpeech } from "@capacitor-community/text-to-speech";
          window.PalmPassTTS = TextToSpeech;
          JS
          npx esbuild tts-bridge-entry.js --bundle --format=esm --platform=browser --target=es2020 --outfile=www/vendor/tts-bridge.js
          rm tts-bridge-entry.js
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.palmpass.app",
            "appName": "PalmPass",
            "webDir": "www",
            "backgroundColor": "#160e3d",
            "server": { "androidScheme": "https" },
            "android": { "allowMixedContent": false }
          }
          JSON
          npx cap add android

      # ---------------------------------------------------------------
      # 3. App icon + splash screen from the ./assets folder
      # ---------------------------------------------------------------
      - name: Generate and verify PalmPass launcher icon and splash
        run: |
          set -euo pipefail
          for asset in icon-only.png icon-foreground.png icon-background.png splash.png splash-dark.png; do
            test -s "assets/$asset" || { echo "::error::Required icon/splash asset missing: assets/$asset"; exit 1; }
          done
          npx capacitor-assets generate --android --assetPath assets \
            --iconBackgroundColor "$BRAND_COLOR" --iconBackgroundColorDark "$BRAND_COLOR" \
            --splashBackgroundColor "$BRAND_COLOR" --splashBackgroundColorDark "$BRAND_COLOR"
          # Fail instead of silently shipping the default Capacitor launcher icon.
          test -s android/app/src/main/res/mipmap-hdpi/ic_launcher.png || { echo "::error::Launcher icon generation did not produce mipmap resources"; exit 1; }
          test -s android/app/src/main/res/mipmap-mdpi/ic_launcher.png || { echo "::error::MDPI launcher icon is missing"; exit 1; }
          find android/app/src/main/res -maxdepth 2 -type f \( -name 'ic_launcher*' -o -name 'splash*' \) -print
          grep -R -q 'ic_launcher' android/app/src/main/AndroidManifest.xml || { echo "::error::Android manifest does not reference the launcher icon"; exit 1; }

      - name: Sync web assets and plugins
        run: |
          set -e
          test -s www/vendor/tts-bridge.js || { echo "::error::Native TTS JavaScript bridge is missing"; exit 1; }
          npx cap sync android

      - name: Patch Android project
        run: |
          set -e
          M=android/app/src/main/AndroidManifest.xml
          # camera permission
          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application|' "$M"
          grep -n "CAMERA" "$M"
          # dark status bar + navigation bar to match the app
          S=android/app/src/main/res/values/styles.xml
          sed -i '/<style name="AppTheme.NoActionBar"/a\        <item name="android:statusBarColor">#160E3D</item>\n        <item name="android:navigationBarColor">#160E3D</item>\n        <item name="android:windowLightStatusBar">false</item>' "$S"
          grep -n "statusBarColor" "$S"
          # every build needs a higher versionCode, otherwise Android refuses to update the installed app
          G=android/app/build.gradle
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" "$G"
          grep -n "versionCode\|versionName" "$G"

      # ---------------------------------------------------------------
      # 4. Sign with the SAME key every time. A new random key on every build makes Android
      #    say "App not installed" when you update, forcing an uninstall that wipes your data.
      # ---------------------------------------------------------------
      - name: Use stable signing key
        run: |
          set -e
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android | head -5

      # ---------------------------------------------------------------
      # 5. Build the APK
      # ---------------------------------------------------------------
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Check and rename APK
        run: |
          set -e
          test -f android/app/build/outputs/apk/debug/app-debug.apk || { echo "::error::APK was not produced"; exit 1; }
          cp android/app/build/outputs/apk/debug/app-debug.apk PalmPass.apk
          ls -la PalmPass.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: PalmPass-apk
          path: PalmPass.apk

      # Publishes a Release so you can open the repo's Releases page on your phone and tap the APK.
      # Non-blocking: if your repo forbids this, the artifact above is still available.
      - name: Publish Release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: PalmPass APK #${{ github.run_number }}
          files: PalmPass.apk

  deploy-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build self-contained MediaPipe browser runtime
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html || { echo "::error::Root index.html is missing"; exit 1; }
          mkdir -p www/vendor/wasm www/assets
          npm init -y >/dev/null
          npm install --no-audit --no-fund @mediapipe/tasks-vision@0.10.14 esbuild

          npx esbuild node_modules/@mediapipe/tasks-vision/vision_bundle.mjs \
            --bundle --format=esm --platform=browser --target=es2020 \
            --outfile=www/vendor/vision_bundle.js
          cp node_modules/@mediapipe/tasks-vision/wasm/* www/vendor/wasm/
          curl -fL --retry 4 --retry-delay 3 -o www/vendor/hand_landmarker.task \
            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"

          test -s www/vendor/vision_bundle.js
          test -s www/vendor/wasm/vision_wasm_internal.wasm
          test "$(stat -c%s www/vendor/hand_landmarker.task)" -gt 1000000

          cp index.html www/index.html
          # Use only same-origin local files for MediaPipe. This also repairs older
          # index.html copies that still contain the original CDN URLs.
          python3 - <<'PYCODE'
          from pathlib import Path
          p = Path('www/index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
            'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs': './vendor/vision_bundle.js',
            'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm': './vendor/wasm',
            'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task': './vendor/hand_landmarker.task',
            './vendor/vision_bundle.mjs': './vendor/vision_bundle.js',
          }
          for old, new in replacements.items():
            s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          assert './vendor/vision_bundle.js' in s, 'MediaPipe module path was not configured'
          assert './vendor/wasm' in s, 'MediaPipe WASM path was not configured'
          assert './vendor/hand_landmarker.task' in s, 'Hand model path was not configured'
          assert 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision' not in s, 'External MediaPipe CDN reference remains'
          assert 'https://storage.googleapis.com/mediapipe-models/hand_landmarker' not in s, 'External hand model reference remains'
          PYCODE

          # Copy existing icons when supplied. Also provide the root touch icon path
          # referenced by the iOS HTML file.
          if [ -d assets ]; then cp assets/*.png www/assets/ 2>/dev/null || true; fi
          if [ -s www/assets/icon-only.png ]; then
            cp www/assets/icon-only.png www/apple-touch-icon.png
          elif [ -s www/assets/icon-foreground.png ]; then
            cp www/assets/icon-foreground.png www/apple-touch-icon.png
          else
            echo "::error::No app icon found in assets/"
            exit 1
          fi

          cat > www/manifest.webmanifest <<'JSON'
          {
            "id": "./",
            "name": "PalmPass - Smart Palm Attendance",
            "short_name": "PalmPass",
            "start_url": "./",
            "scope": "./",
            "display": "standalone",
            "orientation": "portrait",
            "background_color": "#05060e",
            "theme_color": "#05060e",
            "icons": [
              { "src": "./apple-touch-icon.png", "sizes": "192x192", "type": "image/png", "purpose": "any" }
            ]
          }
          JSON

          # A no-op module satisfies the optional native TTS import in the PWA.
          # Native Android builds continue to create the real TTS bridge separately.
          printf 'export {};\\n' > www/vendor/tts-bridge.js

          # Generate a cache list from the actual build output, including every WASM file.
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = 'www';
          const files = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, {withFileTypes:true})) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.name !== 'sw.js') files.push('./' + full.slice(root.length + 1).split(path.sep).join('/'));
            }
          }
          walk(root);
          const precache = ['./', ...files];
          const sw = `const CACHE_NAME = 'palmpass-shell-v3';
          const PRECACHE_URLS = ${JSON.stringify(precache, null, 2)};
          self.addEventListener('install', event => event.waitUntil((async () => {
            const cache = await caches.open(CACHE_NAME);
            await cache.addAll(PRECACHE_URLS);
            await self.skipWaiting();
          })()));
          self.addEventListener('activate', event => event.waitUntil((async () => {
            for (const key of await caches.keys()) if (key !== CACHE_NAME) await caches.delete(key);
            await self.clients.claim();
          })()));
          self.addEventListener('fetch', event => {
            const req = event.request;
            if (req.method !== 'GET' || new URL(req.url).origin !== self.location.origin) return;
            if (req.mode === 'navigate') {
              event.respondWith((async () => {
                try { return await fetch(req); }
                catch { return (await caches.match(new URL('./index.html', self.registration.scope).href)) || Response.error(); }
              })());
              return;
            }
            event.respondWith((async () => {
              const cached = await caches.match(req);
              if (cached) return cached;
              const response = await fetch(req);
              if (response && response.ok) {
                const cache = await caches.open(CACHE_NAME);
                cache.put(req, response.clone());
              }
              return response;
            })());
          });
          `;
          fs.writeFileSync(path.join(root, 'sw.js'), sw);
          NODE

          echo "PWA assets prepared:"
          find www/vendor -maxdepth 2 -type f -printf '%p (%s bytes)\\n' | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload PalmPass PWA
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: Deploy PalmPass PWA
        id: deployment
        uses: actions/deploy-pages@v4
